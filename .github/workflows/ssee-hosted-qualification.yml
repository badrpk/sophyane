name: SSEE hosted candidate qualification

run-name: SSEE hosted qualification ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request UUID from trusted dispatcher
        required: true
        type: string
      candidate_sha:
        description: Immutable candidate commit SHA
        required: true
        type: string
      fixture:
        description: Qualification fixture
        required: true
        type: choice
        options: [candidate, pass, fail, timeout, network]

permissions:
  contents: read

jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Validate immutable request and fetch candidate source without credentials
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          FIXTURE: ${{ inputs.fixture }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          case "$FIXTURE" in candidate|pass|fail|timeout|network) ;; *) exit 2 ;; esac
          mkdir -p "$RUNNER_TEMP/candidate"
          git -C "$RUNNER_TEMP/candidate" init --quiet
          git -C "$RUNNER_TEMP/candidate" -c credential.helper= -c core.hooksPath=/dev/null fetch --quiet --no-tags --depth=1 --filter=blob:limit=64k "https://github.com/${GITHUB_REPOSITORY}.git" "$CANDIDATE_SHA"
          test "$(git -C "$RUNNER_TEMP/candidate" rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
          if [[ "$FIXTURE" == candidate ]]; then
            entry="$(git -C "$RUNNER_TEMP/candidate" ls-tree "$CANDIDATE_SHA" -- ssee_candidate.py)"
            read -r mode object_type blob path <<< "$entry"
            [[ "$mode" == 100644 || "$mode" == 100755 ]]
            [[ "$object_type" == blob && "$path" == ssee_candidate.py ]]
            size="$(git -C "$RUNNER_TEMP/candidate" cat-file -s "$blob")"
            [[ "$size" =~ ^[0-9]+$ && "$size" -le 65536 ]]
            git -C "$RUNNER_TEMP/candidate" cat-file blob "$blob" > "$RUNNER_TEMP/candidate/ssee_candidate.py"
          fi
          git -C "$RUNNER_TEMP/candidate" config --unset-all credential.helper || true

      - name: Run trusted bounded qualification harness
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          FIXTURE: ${{ inputs.fixture }}
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
          QUALIFICATION_WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ssee-evidence"
          PYTHONPATH=src timeout --signal=TERM --kill-after=10s 12m python3 tools/ssee_hosted_qualification.py \
            --candidate-root "$RUNNER_TEMP/candidate" \
            --trusted-root "$GITHUB_WORKSPACE" \
            --candidate-sha "$CANDIDATE_SHA" \
            --workflow-sha "$QUALIFICATION_WORKFLOW_SHA" \
            --run-id "$QUALIFICATION_RUN_ID" \
            --request-id "$REQUEST_ID" \
            --fixture "$FIXTURE" \
            --output-dir "$RUNNER_TEMP/ssee-evidence"

      - name: Upload bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: ssee-hosted-qualification-report
          path: ${{ runner.temp }}/ssee-evidence/qualification-report.*
          if-no-files-found: ignore
          retention-days: 7
