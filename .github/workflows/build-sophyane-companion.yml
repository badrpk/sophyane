name: Build Sophyane Companion APK

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/sophyane-companion/**"
      - ".github/workflows/build-sophyane-companion.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/sophyane-companion

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Show build environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager
          sdkmanager --version

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Validate project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/sophyane/companion/MainActivity.java
          test -f app/src/main/java/com/sophyane/companion/AlarmScheduler.java
          test -f app/src/main/java/com/sophyane/companion/AlarmReceiver.java
          test -f app/src/main/java/com/sophyane/companion/BootReceiver.java
          test -f app/src/main/java/com/sophyane/companion/RingActivity.java

      - name: Build debug APK
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee app-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sophyane-companion-debug-apk
          path: |
            apps/sophyane-companion/app/build/outputs/apk/debug/app-debug.apk
            apps/sophyane-companion/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
