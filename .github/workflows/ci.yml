name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip .[dev]
      - name: Compile
        run: python -m compileall -q src
      - name: Unit tests
        if: matrix.os != 'macos-latest'
        run: python -m pytest

      # GitHub-hosted macOS ARM runners intermittently leave spawned
      # localhost services alive while HTTP health probes time out.
      # Keep the complete deterministic/unit suite on macOS, excluding
      # only tests whose purpose is live local-process/loopback transport.
      #
      # Ubuntu + Windows continue to run the complete suite above.
      - name: Unit tests — macOS deterministic lane
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          python -m pytest \
            --ignore=tests/test_full_stack_binding_provenance_live.py \
            --ignore=tests/test_full_stack_fabric_cutover.py \
            --ignore=tests/test_full_stack_grounded_bindings_live.py \
            --ignore=tests/test_full_stack_grounded_crud_live.py \
            --ignore=tests/test_full_stack_multi_binding_shadowing_live.py \
            --ignore=tests/test_full_stack_service_fabric_integration.py \
            --ignore=tests/test_new_tab_preview_and_gemini_tool_guard.py \
            --ignore=tests/test_rendered_evidence.py

      # Do not silently disable networking on macOS. Prove that a fresh,
      # isolated Python HTTP server can bind, answer, and terminate.
      # GitHub macOS-26 ARM64 runners can keep a child Python HTTP
      # server alive while loopback requests time out. Keep this as
      # diagnostic evidence, but do not let runner transport behavior
      # suppress the substantive macOS regression gates.
      - name: macOS loopback transport diagnostic
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import http.client
          import socket
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path

          with socket.socket() as probe:
              probe.bind(("127.0.0.1", 0))
              port = probe.getsockname()[1]

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              (root / "index.html").write_text(
                  "sophyane-macos-loopback-ok\n",
                  encoding="utf-8",
              )

              process = subprocess.Popen(
                  [
                      sys.executable,
                      "-m",
                      "http.server",
                      str(port),
                      "--bind",
                      "127.0.0.1",
                      "--directory",
                      str(root),
                  ],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  start_new_session=True,
              )

              try:
                  deadline = time.monotonic() + 20.0
                  last = None

                  while time.monotonic() < deadline:
                      if process.poll() is not None:
                          raise SystemExit(
                              f"loopback server exited: {process.returncode}"
                          )

                      connection = http.client.HTTPConnection(
                          "127.0.0.1",
                          port,
                          timeout=1.0,
                      )

                      try:
                          connection.request("GET", "/index.html")
                          response = connection.getresponse()
                          body = response.read()

                          if (
                              response.status == 200
                              and body == b"sophyane-macos-loopback-ok\n"
                          ):
                              print(
                                  "PASS: macOS loopback bind/request/response"
                              )
                              break

                          last = (
                              response.status,
                              body,
                          )

                      except Exception as exc:
                          last = repr(exc)

                      finally:
                          connection.close()

                      time.sleep(0.1)

                  else:
                      raise SystemExit(
                          f"macOS loopback smoke timed out: {last}"
                      )

              finally:
                  process.terminate()

                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait(timeout=5)
          PY

      # The PR-specific answer-race regression must still execute on macOS.
      - name: SLI answer-race regression
        if: always() && matrix.os == 'macos-latest'
        run: |
          python -m pytest -q             tests/test_race_orchestrator.py             tests/test_auto_race_finalization_contract.py             tests/test_race_end_to_end_fast_winner.py

      - name: CLI smoke test
        if: always()
        run: |
          sophyane --version
          sophyane --providers
      - name: Build distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m build
      - name: Upload distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
