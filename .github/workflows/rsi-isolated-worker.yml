name: RSI Isolated Worker Probe

'on':
  workflow_dispatch:
  push:
    branches:
      - rsi-verification/clean-worker-20261011-134523
    paths:
      - .github/workflows/rsi-isolated-worker.yml

permissions:
  contents: read

jobs:
  sandbox-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Inspect worker environment
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          id
          python3 --version
          echo "CANDIDATE_CODE_EXECUTED=NO"

      - name: Install Bubblewrap on ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Inspect Bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          bwrap --version
          command -v unshare
          command -v timeout

      - name: Diagnose namespace isolation
        shell: bash
        run: |
          set -euo pipefail

          # Fixed diagnostic commands only.
          # Never execute repository or RSI candidate code.

          failed_probes=0

          run_probe() {
            name="$1"
            shift

            echo "=== PROBE:$name ==="

            if timeout 15s "$@" >"/tmp/rsi-$name.out" 2>&1; then
              echo "PROBE_${name}=PASS"
            else
              rc="$?"
              echo "PROBE_${name}=FAIL_RC_$rc"
              failed_probes=$((failed_probes + 1))
            fi

            cat "/tmp/rsi-$name.out"
          }

          run_probe USER_MOUNT \
            bwrap \
              --die-with-parent \
              --new-session \
              --unshare-user \
              --ro-bind /usr /usr \
              --proc /proc \
              --dev /dev \
              --tmpfs /tmp \
              --chdir / \
              -- /usr/bin/python3 -c \
              'from pathlib import Path; assert not Path("/home/runner").exists(); print("USER_MOUNT_FILESYSTEM=PASS")'

          run_probe PID_IPC \
            bwrap \
              --die-with-parent \
              --new-session \
              --unshare-user \
              --unshare-pid \
              --unshare-ipc \
              --ro-bind /usr /usr \
              --proc /proc \
              --dev /dev \
              --tmpfs /tmp \
              --chdir / \
              -- /usr/bin/python3 -c \
              'import os; print("PID_IPC_CHILD_PID=" + str(os.getpid()))'

          run_probe NETWORK_BWRAP \
            bwrap \
              --die-with-parent \
              --new-session \
              --unshare-user \
              --unshare-net \
              --ro-bind /usr /usr \
              --proc /proc \
              --dev /dev \
              --tmpfs /tmp \
              --chdir / \
              -- /usr/bin/python3 -c \
              'print("NETWORK_BWRAP_PROCESS_STARTED=YES")'

          run_probe NETWORK_UNSHARE \
            unshare --user --map-root-user --net \
              /usr/bin/python3 -c \
              'from pathlib import Path; print("NETWORK_UNSHARE_PROCESS_STARTED=YES"); print(Path("/proc/self/ns/net").readlink())'

          echo "DIAGNOSTICS_COMPLETED=YES"
          echo "FAILED_PROBE_COUNT=$failed_probes"
          echo "ISOLATION_CAPABILITY=UNVERIFIED"
          echo "SANDBOX_SECURITY_APPROVED=NO"
          echo "RSI_CANDIDATE_EXECUTION=NO"

      - name: Final result
        shell: bash
        run: |
          set -euo pipefail
          echo "NAMESPACE_DIAGNOSTIC_ONLY=YES"
          echo "SANDBOX_SECURITY_APPROVED=NO"
          echo "CANDIDATE_CODE_EXECUTED=NO"
          echo "PRODUCTION_PROMOTION=NO"
