name: Execution evidence acceptance

on:
  pull_request:
  push:
    branches: [release/v13.0.0]
  workflow_dispatch:

jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_execution_evidence.py
      - run: python benchmarks/execution_evidence_acceptance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: execution-evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: benchmark-results/execution-evidence
          retention-days: 90
