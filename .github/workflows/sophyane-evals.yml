name: Sophyane eval validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest "psycopg[binary]>=3.2"

      - name: Tests
        run: python -m pytest -q

      - name: Validate eval cases
        run: |
          python - <<'PY'
          from pathlib import Path
          from sophyane.evals.runner import load_cases

          cases = load_cases(Path("evals/cases.jsonl"))
          assert cases
          assert len({case.id for case in cases}) == len(cases)
          print(f"Validated {len(cases)} evaluation cases")
          PY
