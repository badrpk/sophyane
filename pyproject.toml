[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sophyane"
version = "27.0.0"
description = "Local-first AI software engineering platform with durable execution, repository intelligence, validator-driven recovery, browser verification, multi-provider orchestration, MCP interoperability, and native COI sub-agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Badar Uzaman", email = "badrpk@gmail.com"}]
keywords = ["ai", "coding-agent", "repository", "semantic-index", "self-repair", "multi-agent", "llm", "autonomous", "local-ai", "validated-execution", "local-first", "sandbox", "provider-dispatch", "subagents", "evaluation", "tracing", "compaction", "coi", "mcp", "orchestration", "release-gate", "audit", "benchmark", "sli", "lstm", "intent-routing", "state-graph", "checkpointing", "durable-execution", "browser-verification", "software-engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: Android",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "numpy>=1.26",
  "pexpect>=4.9",
    "psycopg>=3.3,<4",
  "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
arc = [
  "arc-agi>=0.9.9,<1",
]
test = [
  "pytest>=8",
  "psycopg[binary]>=3.2",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "psycopg[binary]>=3.2",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/badrpk/sophyane"
Repository = "https://github.com/badrpk/sophyane"
Issues = "https://github.com/badrpk/sophyane/issues"

[project.scripts]
sophyane = "sophyane.cli_entry:main"
sophyane-web = "sophyane.web:main"
sophyane-doctor = "sophyane.diagnostics:main"
sophyane-browser = "sophyane.browser.launcher:main"
sophyane-sli = "sophyane.sli_cli:main"
sophyane-sli-train = "sophyane.sli_training_loop:main"
sophyane-sli-migrate = "sophyane.sli_schema:main"
sophyane-vela = "sophyane.vela:main"
sophyane-platform = "sophyane.platform_cli:main"
sophyane-memory = "sophyane.memory_architecture:main"
sophyane-task = "sophyane.task_intelligence:main"
sophyane-execute = "sophyane.task_execution:main"
sophyane-coi = "sophyane.coi_cli:main"
sophyane-release = "sophyane.release_cli:main"
sophyane-audit = "sophyane.audit_cli:main"
sophyane-benchmark = "sophyane.benchmark_cli:main"
sophyane-mcp = "sophyane.mcp_server:main"
sophyane-mission = "sophyane.mission_cli:main"
sophyane-arc = "sophyane.arc_agi3:main"
sophyane-arc-suite = "sophyane.arc_suite:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sophyane.browser" = ["home/*"]
"sophyane.expert" = ["data/*.json"]
"sophyane.continual.cpp" = ["CMakeLists.txt", "*.cpp", "include/*.hpp", "src/*.cpp"]
