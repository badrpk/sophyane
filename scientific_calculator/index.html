<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scientific Calculator</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#111827,#1f2937);font:15px system-ui,sans-serif;color:#e5e7eb}.calc{width:min(420px,94vw);background:#0b1220;border:1px solid #ffffff18;border-radius:26px;padding:20px;box-shadow:0 28px 80px #0008}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:800;letter-spacing:.5px}.mode{border:1px solid #ffffff20;background:#172033;color:#dbeafe;border-radius:999px;padding:7px 11px;cursor:pointer}.screen{background:#050914;border:1px solid #ffffff12;border-radius:18px;padding:14px 16px;margin-bottom:14px;min-height:112px;display:flex;flex-direction:column;justify-content:end;overflow:hidden}.expr{min-height:24px;color:#8fa2bf;text-align:right;word-break:break-all}.result{font-size:34px;font-weight:800;text-align:right;word-break:break-all}.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.keys button{min-height:52px;border:0;border-radius:14px;background:#182235;color:#f8fafc;font-size:16px;font-weight:700;cursor:pointer;transition:.15s}.keys button:hover{filter:brightness(1.16)}.keys button:active{transform:scale(.97)}.fn{background:#24344d!important;color:#bfdbfe!important}.op{background:#0f766e!important}.danger{background:#7f1d1d!important}.eq{background:#2563eb!important}.wide{grid-column:span 2}.hint{margin-top:12px;color:#8291a9;font-size:12px;text-align:center}@media(max-width:420px){.calc{padding:14px;border-radius:20px}.keys{gap:7px}.keys button{min-height:48px;font-size:15px}.result{font-size:29px}}</style></head><body><main class="calc"><div class="top"><div class="brand">Scientific Calculator</div><button class="mode" id="angleMode">DEG</button></div><div class="screen"><div class="expr" id="expr"></div><div clas
