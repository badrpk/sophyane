<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snake Game</title>
<style>
body{margin:0;background:#0f172a;color:#f8fafc;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
h1{margin:0 0 10px;font-size:24px}
#s{margin-bottom:10px;font-size:18px}
#c{background:#1e293b;border:2px solid #38bdf8;border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,0.5)}
.g{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px}
#w{position:relative}
button{background:#38bdf8;color:#0f172a;border:none;padding:10px 20px;font-size:16px;font-weight:bold;border-radius:6px;cursor:pointer;margin-top:10px}
button:hover{background:#7dd3fc}
</style>
</head>
<body>
<h1>SNAKE</h1>
<div id="s">Score: <span id="sc">0</span> | High Score: <span id="hs">0</span></div>
<div id="w">
<canvas id="c" width="400" height="400"></canvas>
<div id="go" class="g" style="display:none">
<h2 style="margin:0;font-size:32px;color:#f43f5e">GAME OVER</h2>
<p id="fs" style="margin:10px 0"></p>
<button onclick="rst()">Play Again</button>
</div>
</div>
<script>
const C=document.getElementById('c'),x=C.getContext('2d'),S=20,N=20;
let s,d,nd,f,sc,hs=0,g,iv;
function rst(){
s=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
d={x:1,y:0};nd=d;sc=0;g=0;
document.getElementById('sc').textContent=sc;
document.getElementById('go').style.display='none';
pf();
if(iv)clearInterval(iv);
iv=setInterval(u,100);
}
function pf(){
f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};
if(s.some(p=>p.x===f.x&&p.y===f.y))pf();
}
window.addEventListener('keydown',e=>{
let k=e.key;
if((k==='ArrowUp'||k==='w'||k==='W')&&d.y!==1)nd={x:0,y:-1};
if((k==='ArrowDown'||k==='s'||k==='S')&&d.y!==-1)nd={x:0,y:1};
if((k==='ArrowLeft'||k==='a'||k==='A')&&d.x!==1)nd={x:-1,y:0};
if((k==='ArrowRight'||k==='d'||k==='D')&&d.x!==-1)nd={x:1,y:0};
});
function u(){
if(g)return;
d=nd;
let h={x:s[0].x+d.x,y:s[0].y+d.y};
if(h.x<0||h.x>=N||h.y<0||h.y>=N||s.some(p=>p.x===h.x&&p.y===h.y)){
g=1;clearInterval(iv);
if(sc>hs){hs=sc;document.getElementById('hs').textContent=hs;}
document.getElementById('fs').textContent='Final Score: '+sc;
document.getElementById('go').style.display='flex';
return;
}
s.unshift(h);
if(h.x===f.x&&h.y===f.y){
sc+=10;document.getElementById('sc').textContent=sc;pf();
}else{s.pop();}
dr();
}
function dr(){
x.fillStyle='#1e293b';x.fillRect(0,0,400,400);
x.fillStyle='#f43f5e';x.beginPath();
x.arc(f.x*S+S/2,f.y*S+S/2,S/2-2,0,Math.PI*2);x.fill();
s.forEach((p,i)=>{
x.fillStyle=i===0?'#38bdf8':'#0284c7';
x.fillRect(p.x*S+1,p.y*S+1,S-2,S-2);
});
}
rst();
</script>
</body>
</html>
